<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .entrar { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at top, #16203a 0%, var(--bg) 70%); }
  .caixa { width: 100%; max-width: 380px; background: var(--bg2); border: 1px solid var(--linha); border-radius: 16px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .caixa .marca { justify-content: center; font-size: 20px; margin-bottom: 6px; }
  .caixa .marca img { max-height: 44px; max-width: 160px; }
  .caixa p { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .caixa .btn { width: 100%; padding: 11px; margin-top: 6px; }
  .erro-msg { color: var(--erro); font-size: 13px; min-height: 18px; margin: 4px 0 0; text-align: center; }
</style>
</head>
<body>
<main class="entrar">
  <form class="caixa" id="form">
    <div class="marca" id="marca"><span class="logo">S</span><span id="produto">Studio</span></div>
    <p>Entre para editar seus vídeos</p>
    <label class="campo"><span>E-mail</span><input type="email" id="email" autocomplete="username" required autofocus></label>
    <label class="campo"><span>Senha</span><input type="password" id="senha" autocomplete="current-password" required></label>
    <button class="btn btn-primario" id="btn">Entrar</button>
    <div class="erro-msg" id="erro" role="alert"></div>
  </form>
</main>
<script>
fetch("/api/marca").then((r) => r.json()).then((m) => {
  document.title = `Entrar · ${m.produto || "Studio"}`;
  document.documentElement.style.setProperty("--amarelo", m.destaque || "#F9C700");
  document.documentElement.style.setProperty("--navy", m.cor || "#224289");
  document.getElementById("produto").textContent = m.produto || "Studio";
  if (m.logo) document.querySelector("#marca .logo").outerHTML = '<img src="/logo" alt="">';
  else document.querySelector("#marca .logo").textContent = (m.produto || "S")[0];
}).catch(() => {});
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn"), erro = document.getElementById("erro");
  btn.disabled = true; erro.textContent = "";
  try {
    const r = await fetch("/api/entrar", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value, senha: document.getElementById("senha").value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    erro.textContent = d.erro || "Não foi possível entrar.";
  } catch (_) { erro.textContent = "Sem conexão com o servidor."; }
  btn.disabled = false;
});
</script>
</body>
</html>
