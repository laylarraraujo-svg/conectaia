function drawPhoto(){
  const img=state.photo, sc=Math.max(W/img.width, H/img.height), iw=img.width*sc, ih=img.height*sc;
  cx.drawImage(img, (W-iw)/2, (H-ih)*(state.photoPos/100), iw, ih);

/* quebra de linha com dois pesos: palavras em destaque (negrito amarelo) e o resto (regular branco) */
const FONT_D = s => `800 ${s}px "Barlow", Arial, sans-serif`, FONT_N = s => `500 ${s}px "Barlow", Arial, sans-serif`;
const normW = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[.,:;!?"“”'‘’()]/g,"").toUpperCase();
function marcarDestaque(words, dest){
  const d = dest ? dest.split(/\s+/).map(normW).filter(Boolean) : [];
  if (!d.length) return words.map(()=>false);
  const nw = words.map(normW);
  for (let i=0;i<=nw.length-d.length;i++){ if (d.every((x,k)=>nw[i+k]===x)) return words.map((_,j)=> j>=i && j<i+d.length); }
  return nw.map(w => d.includes(w));
}
function layoutManchete(text, dest, maxW, maxLines){
  const words = String(text||"").split(/\s+/).filter(Boolean), hi = marcarDestaque(words, dest);
  for (let size=74; size>=46; size-=2){
    const lines=[]; let line=[], lw=0;
    for (let i=0;i<words.length;i++){
      cx.font = hi[i] ? FONT_D(size) : FONT_N(size);
      const ww = cx.measureText(words[i]).width, sp = cx.measureText(" ").width;
      const add = line.length ? sp+ww : ww;
      if (line.length && lw+add > maxW){ lines.push({words:line,w:lw}); line=[]; lw=0; }
      line.push({t:words[i],hi:hi[i],w:ww,sp}); lw += line.length>1 ? sp+ww : ww;
    }
    if (line.length) lines.push({words:line,w:lw});
    if (lines.length <= maxLines || size===46) return { size, lines: lines.slice(0, Math.max(maxLines,lines.length)) };
  }
}
function draw(){
  const n=state.current;
  const man = $("#fMan").value || "", fina = $("#fFina").value || "", chapeu = ($("#fChapeu").value||"").toUpperCase().trim(), urg = $("#fUrg").checked;
  const dest = ($("#fDest").value||"").trim();
  cx.clearRect(0,0,W,H);
  cx.fillStyle = VERDE; cx.fillRect(0,0,W,H);
  if (state.photo) drawPhoto(); else cena(tema(n, man), n?.id);
  // escurecimento de baixo para cima, em verde-escuro
  const g = cx.createLinearGradient(0, H*0.36, 0, H);
  g.addColorStop(0,"rgba(3,20,9,0)"); g.addColorStop(.35,"rgba(3,20,9,.72)"); g.addColorStop(.62,"rgba(3,20,9,.95)"); g.addColorStop(1,"rgba(2,14,6,1)");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  if (state.photo){ cx.save(); cx.translate(W-30, 300); cx.rotate(-Math.PI/2); cx.font='600 19px "Barlow", Arial, sans-serif'; cx.fillStyle="rgba(255,255,255,.75)"; cx.textBaseline="middle"; cx.fillText("FOTO: REPRODUÇÃO", 0, 0); cx.restore(); }

  // de baixo para cima: rodapé, linha fina, manchete, logo, chapéu
  const maxW = W - 150, CXm = W/2;
  const hl = layoutManchete(man || "Manchete da notícia", dest, maxW, 4), lh = Math.round(hl.size*1.13);
  const finaLines = fina ? wrap(fina, W-220, '500 30px "Barlow", Arial, sans-serif').slice(0,2) : [];
  const footerY = H - 78;
  let bottom = footerY - 70;
  const finaH = finaLines.length ? finaLines.length*40 + 18 : 0;
  const hlTop = bottom - finaH - hl.lines.length*lh;
  // manchete centralizada
  cx.textBaseline="top"; let y = hlTop;
  for (const ln of hl.lines){
    let x = CXm - ln.w/2;
    ln.words.forEach((w,i) => {
      cx.font = w.hi ? FONT_D(hl.size) : FONT_N(hl.size);
      cx.fillStyle = w.hi ? AMARELO : "#FFFFFF";
      cx.shadowColor="rgba(0,0,0,.35)"; cx.shadowBlur=12;
      cx.fillText(w.t, x, y); x += w.w + (i<ln.words.length-1 ? w.sp : 0);
    });
    y += lh;
  }
  cx.shadowBlur=0;
  if (finaLines.length){ y += 18; cx.font='500 30px "Barlow", Arial, sans-serif'; cx.fillStyle="rgba(226,245,232,.82)"; cx.textAlign="center"; for (const l of finaLines){ cx.fillText(l, CXm, y); y += 40; } cx.textAlign="left"; }
  // logo centralizada acima da manchete
  const tags = []; if (urg) tags.push({t:"● URGENTE", bg:VERMELHO, fg:"#fff"}); if (chapeu && chapeu!=="URGENTE") tags.push({t:chapeu, bg:AMARELO, fg:VERDE});
  const tagsH = tags.length ? 48 + 22 : 0;
  const LW = 340, LH = LOGO.naturalWidth ? Math.round(LW*LOGO.naturalHeight/LOGO.naturalWidth) : 216, ly = hlTop - tagsH - LH - 26;
  if (LOGO.complete && LOGO.naturalWidth){
    cx.save(); cx.shadowColor="rgba(0,0,0,.55)"; cx.shadowBlur=26; cx.shadowOffsetY=6; cx.drawImage(LOGO, CXm-LW/2, ly, LW, LH); cx.restore();
  }
  // selo urgente / chapéu acima da logo
  if (tags.length){
    cx.font='700 26px "Chakra Petch", Arial, sans-serif'; cx.textBaseline="middle";
    const ws = tags.map(t => cx.measureText(t.t).width + 36), total = ws.reduce((a,b)=>a+b,0) + (tags.length-1)*12;
    let tx = CXm - total/2; const tyy = hlTop - 22 - 24;
    tags.forEach((t,i) => { cx.fillStyle=t.bg; roundRect(tx,tyy-24,ws[i],48,24); cx.fill(); cx.fillStyle=t.fg; cx.fillText(t.t, tx+18, tyy+1); tx += ws[i]+12; });
  }
  // rodapé centralizado (só o @)
  cx.textBaseline="middle"; cx.textAlign="center";
  cx.font='700 28px "Chakra Petch", Arial, sans-serif'; cx.fillStyle=AMARELO; cx.fillText("@direitaonlinemogiguacu", CXm, footerY);
  cx.textAlign="left";
  cx.fillStyle=NEON; cx.fillRect(CXm-60, footerY-44, 120, 4);
}
window.renderizar = async (n) => {
  $("#fMan").value = n.manchete || ""; $("#fFina").value = n.linha_fina || "";
  $("#fChapeu").value = n.chapeu || ""; $("#fDest").value = n.destaque || ""; $("#fUrg").checked = !!n.urgente;
  state.current = { id: n.id || n.manchete, categoria: n.categoria || "", titulo: n.manchete || "" };
  state.photo = null;
  if (n.foto) {
    // recorta só a parte de cima da imagem de origem (onde fica a foto, sem a arte/logo do portal)
    const img = new Image(); img.src = n.foto;
    await new Promise(r => { img.onload = r; img.onerror = r; });
    if (img.naturalWidth) {
      const keep = n.foto_recorte || 0.6, c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = Math.round(img.naturalHeight * keep);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height, 0, 0, c.width, c.height);
      state.photo = c; state.photoPos = n.foto_pos ?? 30;
    }
  }
  await document.fonts.ready;
  for (const f of ['800 60px "Barlow Condensed"','500 30px "Barlow"','800 30px "Barlow"','700 28px "Chakra Petch"','600 24px "Barlow"','700 30px "Chakra Petch"','700 26px "Chakra Petch"']) { try { await document.fonts.load(f); } catch(e){} }
  if (!LOGO.complete) await new Promise(r => { LOGO.onload = r; LOGO.onerror = r; });
  draw();
  return cv.toDataURL("image/jpeg", 0.9);
};
