function tema1(t){

  if (has(/pres[oa]|pol[ií]cia|furto|roubo|crime|suspeit|homic|seguran|arromb|gcm|disparo|tr[aá]fico/)) return "seguranca";
  if (has(/sa[uú]de|m[eé]dic|hospital|covid|uti|vacina|samu|santa casa|cirurgia|doen/)) return "saude";

  if (has(/econom|bolsa|inss|sal[aá]rio|vale|pre[cç]o|banco|cr[eé]dito|imposto|emprego/)) return "economia";
  if (has(/cultura|festival|show|arte|sal[aã]o|teatro|m[uú]sica|exposi/)) return "cultura";

    cx.strokeStyle="rgba(120,160,220,.10)"; cx.lineWidth=1.5; for(let i=0;i<W;i+=54){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i,1350);cx.stroke();} for(let j=0;j<1350;j+=54){cx.beginPath();cx.moveTo(0,j);cx.lineTo(W,j);cx.stroke();}
    let y=320; for(let i=0;i<22;i++){ const x=40+i*46, d=(R()-.55)*110, up=d<0; const top=Math.min(y,y+d), h=Math.abs(d)+10; cx.fillStyle=up?"#2BE07A":RED2; cx.fillRect(x,top,26,h); cx.fillRect(x+12,top-22,3,h+44); y+=d; y=Math.max(160,Math.min(760,y)); }
    glow(800,600,420,"rgba(255,40,60,.28)");
  } else if (kind==="cultura"){
    sky("#0B0620","#1C0B33","#050310");
    cx.globalCompositeOperation="lighter";
    [[180,"rgba(255,60,140,.22)"],[540,"rgba(255,220,120,.22)"],[900,"rgba(80,140,255,.22)"]].forEach(([x,c])=>{ cx.fillStyle=c; cx.beginPath(); cx.moveTo(x,-20); cx.lineTo(x-260,900); cx.lineTo(x+260,900); cx.closePath(); cx.fill(); });
    cx.globalCompositeOperation="source-over";
    bokeh(R,20,["rgba(255,200,120,.7)","rgba(255,80,160,.6)"],60,600,10,40);
    cx.fillStyle="#04020A"; for(let i=0;i<30;i++){ cx.beginPath(); cx.arc(R()*W, 860+R()*60, 40+R()*30, 0, Math.PI*2); cx.fill(); }
  } else if (kind==="esporte"){
    sky("#061024","#0B2A1E","#03100A");
    [[160,120],[920,120]].forEach(([x,y])=>{ glow(x,y,380,"rgba(255,255,230,.6)"); for(let i=0;i<9;i++) glow(x-80+(i%3)*80,y-40+Math.floor(i/3)*40,26,"rgba(255,255,255,1)"); });
    cx.fillStyle="#0D4A2A"; cx.beginPath(); cx.moveTo(240,600); cx.lineTo(840,600); cx.lineTo(1300,1350); cx.lineTo(-220,1350); cx.closePath(); cx.fill();
    cx.strokeStyle="rgba(255,255,255,.55)"; cx.lineWidth=5; cx.beginPath(); cx.moveTo(540,600); cx.lineTo(540,1350); cx.stroke(); cx.beginPath(); cx.ellipse(540,800,190,70,0,0,Math.PI*2); cx.stroke();
  } else if (kind==="educacao"){
    sky("#0B1430","#16233F","#060A16");
    glow(760,260,420,"rgba(255,220,150,.45)");
    const cols=["#C8102E","#1F4FBF","#E8B32A","#2A9D6A","#7A3FBF"];
    for(let i=0;i<7;i++){ cx.fillStyle=cols[i%5]; roundRect(170+i*14, 720-i*62, 560-i*18, 58, 6); cx.fill(); cx.fillStyle="rgba(255,255,255,.85)"; cx.fillRect(190+i*14, 740-i*62, 60, 6); }
  } else if (kind==="busca"){
    sky("#050B1E","#0B1736","#03060F");
    cx.strokeStyle="rgba(255,60,70,.35)"; cx.lineWidth=3; for(let r=80;r<760;r+=110){ cx.beginPath(); cx.arc(540,430,r,0,Math.PI*2); cx.stroke(); }
    const g=cx.createConicGradient ? cx.createConicGradient(-Math.PI/2,540,430) : null;
    if (g){ g.addColorStop(0,"rgba(255,40,50,.55)"); g.addColorStop(.12,"rgba(255,40,50,0)"); g.addColorStop(1,"rgba(255,40,50,0)"); cx.fillStyle=g; cx.beginPath(); cx.arc(540,430,760,0,Math.PI*2); cx.fill(); }
    glow(540,430,120,"rgba(255,50,60,1)");
  } else {
    sky("#0A1638","#33204A","#070A16");
    glow(540,620,560,"rgba(255,140,90,.35)");
    let x=0; while(x<W){ const w=50+R()*110, h=180+R()*420; cx.fillStyle=`rgb(${8+R()*10},${10+R()*12},${26+R()*18})`; cx.fillRect(x,860-h,w,h+500); for(let wy=870-h; wy<850; wy+=34) for(let wx=x+10; wx<x+w-14; wx+=24) if(R()>.55){ cx.fillStyle=`rgba(255,${200+R()*50},${120+R()*80},${.5+R()*.5})`; cx.fillRect(wx,wy,12,16);} x+=w+4; }
  }
  cx.restore();
}
function drawPhoto(){
  const W=1080,H=1350,img=state.photo, sc=Math.max(W/img.width, H/img.height), iw=img.width*sc, ih=img.height*sc;
  cx.drawImage(img, (W-iw)/2, (H-ih)*(state.photoPos/100), iw, ih);
}
function draw(){
  const W=1080, H=1350, n=state.current;
  const man = $("#fMan").value || "", fina = $("#fFina").value || "", chapeu = ($("#fChapeu").value||"").toUpperCase(), urg = $("#fUrg").checked;
  const dest = ($("#fDest").value||"").trim().toUpperCase();
  cx.clearRect(0,0,W,H);
  if (state.photo) drawPhoto(); else cena(tema(n, man), n?.id);
  // escurecimento para leitura
  const g = cx.createLinearGradient(0, H*0.30, 0, H); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(.45,"rgba(0,0,0,.85)"); g.addColorStop(1,"rgba(0,0,0,1)");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // logo
  if (LOGO.complete && LOGO.naturalWidth){
    cx.save(); cx.shadowColor="rgba(255,106,0,.75)"; cx.shadowBlur=34; roundRect(56,52,190,190,26); cx.fillStyle=NAVY; cx.fill(); cx.restore();
    cx.save(); roundRect(56,52,190,190,26); cx.clip(); cx.drawImage(LOGO,56,52,190,190); cx.restore();
    cx.strokeStyle=LARANJA; cx.lineWidth=6; roundRect(56,52,190,190,26); cx.stroke();
  }
  if (state.photo){ cx.save(); cx.translate(W-40, 260); cx.rotate(-Math.PI/2); cx.font='600 20px "Barlow", Arial, sans-serif'; cx.fillStyle="rgba(255,255,255,.75)"; cx.textBaseline="middle"; cx.fillText("FOTO: REPRODUÇÃO", 0, 0); cx.restore(); }
  // texto
  const L = 72, maxW = W - L*2;
  const hl = fitHeadline(man || "Manchete da notícia", maxW, 4), lh = hl.size*0.98;
  const finaLines = fina ? wrap(fina, maxW, '500 36px "Barlow", Arial, sans-serif').slice(0,3) : [];
  const footerY = H - 92;
  let y = footerY - 40 - finaLines.length*46 - (finaLines.length?22:0) - hl.lines.length*lh;
  cx.textBaseline="middle"; cx.font='700 30px "Chakra Petch", Arial, sans-serif';
  let x0 = L;
  if (urg){ const tw=cx.measureText("● URGENTE").width+40; cx.fillStyle="#FFFFFF"; roundRect(x0,y-78,tw,54,8); cx.fill(); cx.fillStyle=RED; cx.fillText("● URGENTE", x0+20, y-50); x0 += tw+12; }
  const chTxt = chapeu || "MOGI GUAÇU";
  if (!(urg && chTxt==="URGENTE")){ const cw=cx.measureText(chTxt).width+40; cx.fillStyle=LARANJA; roundRect(x0,y-78,cw,54,8); cx.fill(); cx.fillStyle="#fff"; cx.fillText(chTxt, x0+20, y-50); }
  cx.textBaseline="top"; cx.font = hl.font;
  const dw = dest ? dest.split(/\s+/) : [];
  for (const line of hl.lines){
    let x = L;
    for (const w of line.split(" ")){
      const clean = w.replace(/[.,:;!?"“”]/g,"");
      if (dw.includes(clean)){ const ww=cx.measureText(w).width; cx.fillStyle=LARANJA; cx.fillRect(x-6, y+hl.size*0.08, ww+12, hl.size*0.9); }
      cx.fillStyle="#FFFFFF"; cx.fillText(w, x, y); x += cx.measureText(w+" ").width;
    }
    y += lh;
  }
  if (finaLines.length){ y += 22; cx.font='500 36px "Barlow", Arial, sans-serif'; cx.fillStyle="rgba(232,237,251,.88)"; for (const l of finaLines){ cx.fillText(l, L, y); y += 46; } }
  cx.fillStyle = LARANJA; cx.fillRect(L, footerY, 90, 6);
  cx.textBaseline="middle"; cx.font='700 28px "Chakra Petch", Arial, sans-serif'; cx.fillStyle="#fff"; cx.fillText("@mogiguacualerta", L, footerY+44);
  const dt = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"}).toUpperCase();
  cx.font='600 24px "Barlow", Arial, sans-serif'; cx.fillStyle="rgba(232,237,251,.7)"; cx.fillText(dt, W-L-cx.measureText(dt).width, footerY+44);
}
window.renderizar = async (n) => {
  $("#fMan").value = n.manchete || ""; $("#fFina").value = n.linha_fina || "";
  $("#fChapeu").value = n.chapeu || ""; $("#fDest").value = n.destaque || ""; $("#fUrg").checked = !!n.urgente;
  state.current = { id: n.id || n.manchete, categoria: n.categoria || "", titulo: n.manchete || "" };
  state.photo = null;
  await document.fonts.ready;
  for (const f of ['800 60px "Barlow Condensed"','500 30px "Barlow"','800 30px "Barlow"','700 28px "Chakra Petch"','600 24px "Barlow"','700 30px "Chakra Petch"','700 26px "Chakra Petch"']) { try { await document.fonts.load(f); } catch(e){} }
  if (!LOGO.complete) await new Promise(r => { LOGO.onload = r; LOGO.onerror = r; });
  draw();
  return cv.toDataURL("image/jpeg", 0.9);
};
